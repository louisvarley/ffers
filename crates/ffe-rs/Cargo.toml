[package]
name = "ffe-rs"
version = "0.9.17"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Experimental playable native Rust First Encounters development slice"

[dependencies]
ffe-core = { path = "../ffe-core" }
ffe-content = { path = "../ffe-content" }
ffe-audio = { path = "../ffe-audio" }
ffe-convert = { path = "../ffe-convert" }
ffe-tools = { path = "../ffe-tools" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
minifb = { version = "0.28", default-features = false, features = ["x11"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
gilrs = "0.11"
raw-window-handle = "0.6"
winapi = { version = "0.3", features = ["commctrl", "libloaderapi", "winuser"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
